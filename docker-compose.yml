services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
  gateway:
    build: .
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379/0
      SWITCHBOARD_DB: /data/switchboard.db
    volumes: ["sbdata:/data"]
    ports: ["8000:8000"]
    depends_on: {redis: {condition: service_healthy}}
    command: ["switchboard", "serve", "--host", "0.0.0.0", "--port", "8000"]
  worker:
    build: .
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379/0
      SWITCHBOARD_DB: /data/switchboard.db
    volumes: ["sbdata:/data"]
    depends_on: {redis: {condition: service_healthy}}
    command: ["switchboard", "worker", "--concurrency", "16"]
volumes:
  sbdata: {}
# NOTE: Postgres/pgvector is NOT used in this version (SQLite + in-process cache; see docs/DECISIONS.md).
