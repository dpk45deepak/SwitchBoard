[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "switchboard-gateway"
version = "0.1.0"
description = "Self-hosted LLM gateway + batch scheduler with one OpenAI-compatible API"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "numpy>=1.26", "scikit-learn>=1.4", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
redis = ["redis>=5"]
embeddings = ["sentence-transformers>=2.7"]
tokens = ["tiktoken>=0.7"]
bench = ["matplotlib>=3.8"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.10", "openai>=1.30", "types-PyYAML"]

[project.scripts]
switchboard = "switchboard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
switchboard = ["models.yaml", "routing/router_model.pkl", "dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
